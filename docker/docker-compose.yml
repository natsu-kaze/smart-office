name: smart-office

services:
  mysql:
    image: mysql:8.4.0
    container_name: smart-office-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smart_office}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - smart-office-mysql-data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
      - ../smart-office-server/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../smart-office-server/src/main/resources/db/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
      - ./mysql/init/03-xxl-job.sql:/docker-entrypoint-initdb.d/03-xxl-job.sql:ro
      - ./mysql/init/04-smart-office-microservices.sql:/docker-entrypoint-initdb.d/04-smart-office-microservices.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: smart-office-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - smart-office-redis-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: smart-office-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
      TZ: Asia/Shanghai
    ports:
      - "${NACOS_HOST_PORT:-8848}:8848"
      - "${NACOS_GRPC_HOST_PORT:-9848}:9848"
    volumes:
      - smart-office-nacos-data:/home/nacos/data
      - smart-office-nacos-logs:/home/nacos/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8848/nacos/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 20

  nacos-config-importer:
    image: curlimages/curl:8.10.1
    container_name: smart-office-nacos-config-importer
    depends_on:
      nacos:
        condition: service_healthy
    volumes:
      - ./nacos/config:/config:ro
    entrypoint: ["/bin/sh", "-ec"]
    command: >
      'for file in /config/*.yaml; do
        data_id="$$(basename "$$file")";
        for attempt in $$(seq 1 20); do
          echo "Publishing $$data_id to Nacos, attempt $$attempt";
          if curl -fsS -X POST "http://nacos:8848/nacos/v1/cs/configs" --data-urlencode "dataId=$$data_id" --data-urlencode "group=DEFAULT_GROUP" --data-urlencode "type=yaml" --data-urlencode "content@$$file"; then
            break;
          fi;
          if [ "$$attempt" = "20" ]; then
            exit 1;
          fi;
          sleep 3;
        done;
      done'
    restart: "no"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: smart-office-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-smartoffice}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-123456}
      TZ: Asia/Shanghai
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    volumes:
      - smart-office-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.5
    container_name: smart-office-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      TZ: Asia/Shanghai
    ports:
      - "${ELASTICSEARCH_HTTP_PORT:-9200}:9200"
      - "${ELASTICSEARCH_TRANSPORT_PORT:-9300}:9300"
    volumes:
      - smart-office-elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health | grep -E 'green|yellow'"]
      interval: 15s
      timeout: 10s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: smart-office-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-smartoffice}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-smartoffice123456}
      TZ: Asia/Shanghai
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - smart-office-minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.1
    container_name: smart-office-xxl-job-admin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?Unicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
        --spring.datasource.username=root
        --spring.datasource.password=${MYSQL_ROOT_PASSWORD:-123456}
        --xxl.job.accessToken=${XXL_JOB_ACCESS_TOKEN:-smart-office}
      TZ: Asia/Shanghai
    ports:
      - "${XXL_JOB_ADMIN_PORT:-8088}:8080"
    volumes:
      - smart-office-xxl-job-logs:/data/applogs

volumes:
  smart-office-mysql-data:
  smart-office-redis-data:
  smart-office-nacos-data:
  smart-office-nacos-logs:
  smart-office-rabbitmq-data:
  smart-office-elasticsearch-data:
  smart-office-minio-data:
  smart-office-xxl-job-logs:
