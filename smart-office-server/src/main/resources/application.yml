server:
  port: 8080

spring:
  application:
    name: smart-office-server
  profiles:
    active: dev
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  type-aliases-package: com.natsukaze.smartoffice.*.entity
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

springdoc:
  swagger-ui:
    path: /swagger-ui.html

knife4j:
  enable: true
  setting:
    language: zh_cn

smart-office:
  jwt:
    issuer: smart-office
    secret: ${SMART_OFFICE_JWT_SECRET:smart-office-dev-secret-at-least-32-bytes}
    expiration: 86400000
