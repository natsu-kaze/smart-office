spring:
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        enabled: ${NACOS_DISCOVERY_ENABLED:true}
        register-enabled: ${NACOS_REGISTER_ENABLED:true}
        group: ${NACOS_DISCOVERY_GROUP:DEFAULT_GROUP}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        enabled: ${NACOS_CONFIG_ENABLED:true}
        group: ${NACOS_CONFIG_GROUP:DEFAULT_GROUP}
        file-extension: yaml
  config:
    import:
      - optional:nacos:${spring.application.name}.yaml
      - optional:nacos:shared-spring.yaml
      - optional:nacos:shared-mybatis.yaml
      - optional:nacos:shared-logs.yaml
      - optional:nacos:shared-feign.yaml

smart-office:
  xxl-job:
    enabled: ${XXL_JOB_ENABLED:false}
    admin-addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://127.0.0.1:8088/xxl-job-admin}
    app-name: ${XXL_JOB_APPROVAL_APP_NAME:smart-office-approval-job-executor}
    port: ${XXL_JOB_APPROVAL_PORT:10000}
    access-token: ${XXL_JOB_ACCESS_TOKEN:smart-office}
    log-path: ${XXL_JOB_LOG_PATH:logs/xxl-job}
    log-retention-days: ${XXL_JOB_LOG_RETENTION_DAYS:30}
